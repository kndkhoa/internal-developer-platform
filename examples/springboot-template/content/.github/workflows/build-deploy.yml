name: Build & Deploy to ECS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ${{ values.awsRegion }}
  ECR_REPOSITORY: ${{ values.name }}
  ECS_CLUSTER: ${{ values.ecsClusterName }}
  ECS_SERVICE: ${{ values.name }}-service
  CONTAINER_NAME: ${{ values.name }}

jobs:
  # ─── Step 1: Provision Infrastructure ───
  infra:
    name: Provision Infrastructure (Terraform)
    runs-on: ubuntu-latest
    outputs:
      ecr_url: ${{ "${{" }} steps.tf-output.outputs.ecr_url ${{ "}}" }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ "${{" }} secrets.AWS_ACCESS_KEY_ID ${{ "}}" }}
          aws-secret-access-key: ${{ "${{" }} secrets.AWS_SECRET_ACCESS_KEY ${{ "}}" }}
          aws-region: ${{ values.awsRegion }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -input=false -backend=false

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve -input=false

      - name: Get Terraform Outputs
        id: tf-output
        working-directory: terraform
        run: |
          echo "ecr_url=$(terraform output -raw ecr_repository_url)" >> $GITHUB_OUTPUT

  # ─── Step 2: Build & Deploy ───
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: infra
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Run Tests
        run: mvn test

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ "${{" }} secrets.AWS_ACCESS_KEY_ID ${{ "}}" }}
          aws-secret-access-key: ${{ "${{" }} secrets.AWS_SECRET_ACCESS_KEY ${{ "}}" }}
          aws-region: ${{ values.awsRegion }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ "${{" }} steps.login-ecr.outputs.registry ${{ "}}" }}
          IMAGE_TAG: ${{ "${{" }} github.sha ${{ "}}" }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ values.name }}-task \
            --query taskDefinition \
            > task-definition.json

      - name: Update ECS task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: $CONTAINER_NAME
          image: ${{ "${{" }} steps.build-image.outputs.image ${{ "}}" }}

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ "${{" }} steps.task-def.outputs.task-definition ${{ "}}" }}
          service: $ECS_SERVICE
          cluster: $ECS_CLUSTER
          wait-for-service-stability: true
